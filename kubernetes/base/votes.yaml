apiVersion: apps/v1
kind: Deployment
metadata:
  name: votes
  labels:
    app.kubernetes.io/name: votes
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: lab404
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: votes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: votes
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: lab404
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: votes
          image: ghcr.io/leofvo/lab404-votes:latest
          imagePullPolicy: Always
          env:
            - name: VALKEY_ADDR
              value: valkey:6379
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            - name: OTEL_SERVICE_NAME
              value: votes
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: votes
  labels:
    app.kubernetes.io/name: votes
    app.kubernetes.io/part-of: lab404
spec:
  selector:
    app.kubernetes.io/name: votes
  ports:
    - name: http
      port: 8081
      targetPort: http
