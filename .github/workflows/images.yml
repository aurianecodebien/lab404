name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9

jobs:
  lint:
    name: Lint ${{ matrix.service }} Dockerfile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Hadolint
        env:
          SERVICE: ${{ matrix.service }}
        run: docker run --rm -i "$HADOLINT_IMAGE" < "apps/${SERVICE}/Dockerfile"

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: lint
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${SERVICE}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          raw="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          if [ "$(jq -r .mediaType <<< "$raw")" = "application/vnd.oci.image.index.v1+json" ]; then
            manifest="$(jq -r --arg platform "$PLATFORM" \
              '.manifests[] | select(.platform.os + "/" + .platform.architecture == $platform) | .digest' \
              <<< "$raw")"
          else
            manifest="$DIGEST"
          fi
          test -n "$manifest"
          mkdir -p /tmp/build
          echo "$DIGEST" > /tmp/build/index-digest
          echo "$manifest" > /tmp/build/manifest-digest
          echo "${IMAGE}@${manifest} (${PLATFORM})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/build/
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Scan ${{ matrix.service }} for ${{ matrix.arch }} with Trivy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/build

      - name: Scan the platform manifest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          ref="ghcr.io/${OWNER,,}/lab404-${SERVICE}@$(cat /tmp/build/manifest-digest)"
          mkdir -p evidence "$RUNNER_TEMP/trivy-cache"
          trivy() {
            docker run --rm \
              -v "$RUNNER_TEMP/trivy-cache:/cache" \
              -v "$PWD/evidence:/out" \
              "$TRIVY_IMAGE" image --quiet --cache-dir /cache --image-src remote "$@" "$ref"
          }
          trivy --format cyclonedx --output /out/sbom.cdx.json
          trivy --scanners vuln --format json --output /out/vulnerabilities.json
          trivy --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

  dockle:
    name: Audit ${{ matrix.service }} for ${{ matrix.arch }} with Dockle
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/build

      - name: Audit the platform manifest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          ref="ghcr.io/${OWNER,,}/lab404-${SERVICE}@$(cat /tmp/build/manifest-digest)"
          mkdir -p evidence
          docker run --rm \
            -v "$PWD/evidence:/out" \
            "$DOCKLE_IMAGE" \
            --exit-code 1 --exit-level warn \
            --accept-key=--access-logfile \
            --format json --output /out/dockle.json \
            "$ref"

      - name: Upload Dockle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-${{ matrix.service }}-*
          path: /tmp/build

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform index
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          COMMIT: ${{ github.sha }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}"
          immutable="${image}:sha-${COMMIT}"
          if docker buildx imagetools inspect "$immutable" > /dev/null 2>&1; then
            echo "::error::${immutable} already exists and must not be moved."
            exit 1
          fi
          tags=(--tag "$immutable")
          if [ "$ON_MAIN" = true ]; then
            tags+=(--tag "${image}:latest")
          fi
          sources=()
          for file in /tmp/build/*/index-digest; do
            sources+=("${image}@$(cat "$file")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$immutable" --format '{{json .Manifest}}' | jq -r .digest)"
          mkdir -p evidence
          echo "${image}@${digest}" > "evidence/index-${SERVICE}.txt"
          echo "${immutable} -> ${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload index digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ matrix.service }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign ${{ matrix.service }} index
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-${{ matrix.service }}
          path: /tmp/index

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the index recursively
        env:
          SERVICE: ${{ matrix.service }}
        run: cosign sign --yes --recursive "$(cat "/tmp/index/index-${SERVICE}.txt")"

      - name: Verify the index and platform manifests
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          index="$(cat "/tmp/index/index-${SERVICE}.txt")"
          image="${index%@*}"
          refs=("$index")
          while read -r digest; do
            refs+=("${image}@${digest}")
          done < <(docker buildx imagetools inspect --raw "$index" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')
          test "${#refs[@]}" -eq 3
          for ref in "${refs[@]}"; do
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" > /dev/null
            echo "verified ${ref}" >> "$GITHUB_STEP_SUMMARY"
          done

  evidence:
    name: Upload image evidence
    needs: publish
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: evidence

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: index-*
          path: evidence

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
