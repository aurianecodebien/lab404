apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml

helmGlobals:
  chartHome: .cache/charts

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.1
    releaseName: metallb
    namespace: metallb-system
    includeCRDs: true
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.8.3
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.165.0
    releaseName: otel-collector
    namespace: observability
    valuesFile: opentelemetry-values.yaml
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: 3.8.2
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    skipTests: true
    valuesFile: kyverno-values.yaml
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: 2.22.0
    releaseName: sealed-secrets
    namespace: sealed-secrets
    includeCRDs: true
    valuesFile: sealed-secrets-values.yaml
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.2.1
    releaseName: falco
    namespace: falco
    skipTests: true
    valuesFile: falco-values.yaml
