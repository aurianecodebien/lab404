apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab404
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [web, votes]
      ports:
        - protocol: TCP
          port: 4318
